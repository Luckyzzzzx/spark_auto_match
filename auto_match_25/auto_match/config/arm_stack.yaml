# 堆叠动作参数（改这里不用改代码）
#
# 背景：uArm 的 G0 是关节插补，竖直抬升会带水平漂移；单段大位移 + 固定
# sleep(1) 会让下一条指令插进来重新规划，末端抄近路穿过砖堆。
# 这里把动作拆成小步，并在下发前做 IK 自检。
#
# 回退：把 enabled 改成 false，全部动作退回旧的"单段 set_pose"行为。

enabled: true

# ---- 分段抬升 ----
step_mm: 20.0          # 每段抬多高（越小越稳越慢；20 与 C 组已验证的两段抬升一致）
step_dwell: 0.45       # 每段之间停多久，等固件走完（不要再被下一条指令打断）
lift_bias_x: -4.0      # 抬升时朝机械臂底座方向的偏置，把弧线漂移压向"离开砖堆"
lift_bias_y: 0.0

# ---- 抓取后抬到哪 ----
# 必须 > 砖高 + 20mm，否则横移时块底会蹭到邻块顶面（这就是"抬升高度不够"）
lift_after_grasp: 120.0        # 一层：接触点 + 120mm
lift_after_grasp_cake: 90.0    # 二层蛋糕：原来只抬 +20mm，明显不够

# ---- 放置（堆叠）----
approach_dx: -45.0     # 先到目标的"外侧"（-x = 靠近车体 = 远离塔）再进正上方
approach_dy: 0.0
approach_up: 45.0      # 接近高度（相对目标 z）；接近臂展上限时会自动压小
descend_steps: 4       # 下降分几段
release_dwell: 0.5     # 松泵后停留，等真空泄掉再撤
retract_up: 25.0       # 松泵后先斜向抬起的相对高度

# ---- 安全 ----
ik_margin: 0.0         # >0 时要求目标 ±margin 也可达（当前不启用，避免误拒 ready 位）
ik_guard: true         # true = 不可达位姿不下发（固件会静默忽略，等于白等）

# ---- 每层放置的腕部 z（mm）----
# 两种写法，二选一：
#  A) 填死表格（优先级最高）：第一层 / 第二层 / 第三层
#       layer_z: [-55, 60, 160]
#  B) 只填砖高，让代码推算：第 n 层 = contact_z + n * brick_h
#       layer_z: []          # 留空
#       contact_z: -55.0     # 第一层接触高度（原始值）
#       brick_h: 115.0       # ★ 金砖高度，必须实测
#
#  ⚠ 腕部 z 的物理上限约 174mm（IK 扫描结果，全工作空间都上不去）。
#    如果 contact_z + 2*brick_h 接近或超过 174，第三层就是**够不到**的，
#    不是参数没调好。此时要么按 A 显式给一个够得着的层高，要么接受两层塔。
layer_z: []
contact_z: -55.0
# 2026-11-23 用 D435 深度实测：场地平铺的 3 块金砖顶面离地 97 / 97 / 100 mm
# -> 砖高 100mm。于是三层接触高度 = -55 / 45 / 145（145 + 砖高100 = 245 的
#    "抬起净空" 也在 174 以内，所以三层塔是够得着的；原来的 160 是"高空释放"
#    而不是接触高度，所以砖会砸下来/被弧线带偏）。
brick_h: 100.0

# 高层放不下时的退化策略：放到地面（保 1 分）而不是硬撞塔
floor_fallback: true
fallback_dy: -110.0

# ---- set_pose 的等待模型 ----
sec_per_mm: 0.0045     # 每毫米约 4.5ms（≈220mm/s）
wait_min: 0.55
wait_max: 6.0
