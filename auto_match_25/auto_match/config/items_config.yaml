# ============================================================
# 物品 / 识别 / 分类板 配置
# 负责人：A（视觉感知）  维护：detect_ros.py、board_classifier.py
# 依据：《赛项规则拟定版》自动任务赛 —— 场地 3x3m，A/B/C/D 四个得分区，
#       中央金砖区分两层：一层 3x3 共 9 块（玩偶3/时钟3/香蕉3，间隔 4.5cm），
#       二层中间 1 块蛋糕；分类台（0.4x0.33x0.2m）上放 0.34x0.1m 分类板，
#       板上是玩偶/时钟/香蕉三种图案，顺序每局随机。
# 其它模块只读，不要改；改阈值请只改本文件，不要改 .py
# ============================================================

# 类别名 -> 下发 ID（下游 runtask 用这个 ID 判断物品类型）
items:
  bear: 1        # 玩偶
  wine: 2        # 旧模型的第四类（若你们权重里还有酒/杯子，保留这条用于兼容）
  clock: 3       # 时钟（一层正中间固定是时钟，方向随机）
  banana: 4      # 香蕉
  cake: 5        # 蛋糕：二层中间 1 块，规则要求「第一个放到 A 区」，否则本局不计分
  bear_site: 10
  wine_site: 20
  clock_site: 30
  banana_site: 40
  cake_site: 50
  base: 99

# 参与抓取的四类物品（runtask 按 a/b/c/d 顺序取 search_id）
# 规则里这四类是：玩偶 / 时钟 / 香蕉 / 蛋糕。
# 如果你们的权重只认 wine 不认 cake，把 objects_d 改回 wine 即可（一行）。
objects:
  objects_a: bear
  objects_b: clock
  objects_c: banana
  objects_d: cake

# ============================ 检测 ============================
detect:
  # 推理后端：ultralytics / yolov5
  # 【2026-11-23 实测 10.24.170.0】机器人上现有权重 ~/auto.pt、~/banana.pt 是 **YOLOv5** 训练的，
  # ultralytics 8.x 会直接拒绝加载（"NOT forwards compatible with YOLOv8"），
  # 而 ~/yolov8n.pt 并不存在。系统 python3 同时装了 yolov5 7.0.13 与 ultralytics 8.0.143，
  # 所以这里用 yolov5 后端跑自训练权重；等重训出 YOLOv8 权重再改回 ultralytics（一行）。
  backend: yolov5

  # 模型路径，允许 ~ / $HOME；非空模型都会运行，结果合并。
  model_auto: ~/auto.pt          # 14M，2024 训练，含项目四类
  model_banana: ~/banana.pt      # 6.4M，2025 训练，香蕉单独一个模型

  # 类别别名：**只在使用 COCO 预训练权重时才有用**（COCO 里玩偶叫 "teddy bear"、酒杯叫 "wine glass"）。
  # 自训练权重（~/auto.pt、~/banana.pt）的类别名已经是项目内部名，必须留空！
  # 2026-11-23 实测：留着 "bear": wild_bear 会把玩偶类改名成 wild_bear，
  #   启动自检直接报「模型缺少 bear」→ 玩偶永远识别不到。
  # 例（仅 COCO 权重时）：
  #   "teddy bear": bear
  #   "wine glass": wine
  class_aliases: {}

  # 置信度：低于该值的框直接丢弃
  conf_thres: 0.5
  # 按类别单独覆盖置信度，例： {cake: 0.45, clock: 0.55}
  class_conf: {}

  # YOLO 推理参数
  # 比赛 10 分钟要抓 10 块，单块留给识别的时间很紧；
  # 想提速先把 augment 改 false（通常快 1.5~2 倍），精度不够再改回来。
  augment: false
  iou_thres: 0.45
  img_size: 640

  # 处理帧率上限（Hz）。相机一般 30Hz，双模型推理跟不上，
  # 用这个值主动丢帧，避免消息积压导致 /objects 延迟越来越大。
  max_rate_hz: 8.0

  # 是否发布 /debug_image（画框后的图）。比赛时可关掉省带宽。
  publish_debug_image: true

  # 这些 ID 不发布到 /objects（场地标记/底板）。留空 = 全部发布（与旧行为一致）
  filter_ids: []

  # 启动时检查：items 里这些类别是否真的存在于模型权重里。
  # 缺了会打一条醒目的 warn（例如模型没有 cake，二层那块永远抓不到）。
  # 留空 = 检查 items 里所有非 *_site / base 的类别。
  check_classes: []

# =========================== 分类板 ===========================
# 分类板：三个格子从左到右对应 B/C/D 三个放置区。
# 板子尺寸 0.34m x 0.1m，很小，所以对「三格间距是否均匀」有校验，防止斜看时顺序错。
board:
  enabled: true

  # 默认等待 runtask 到达分类区后调用 /board_classifier/capture，避免在路上误锁定映射。
  capture_on_start: false

  # 可选分类板 ROI: [x_min, y_min, x_max, y_max]，空列表表示暂时使用全图。
  # 上机确定分类区停车位后应填入像素范围，进一步排除中央金砖等干扰。
  roi: []

  # 三个格子从左到右对应的放置区（顺序不能乱）
  zones: [Collection_B, Collection_C, Collection_D]

  # 一帧里至少要识别到几个才认为是完整的分类板
  expect_num: 3

  # 连续多少帧结果一致才认为稳定（相机抖动/误检的过滤，1 = 不过滤）
  stable_frames: 3

  # 两个框中心 x 距离小于该像素值视为同一个物体，去重
  x_tolerance: 30

  # 三格相邻间距的均匀度下限（最小间距/最大间距）。
  # 分类板是等宽三格，正视时接近 1.0；斜视或凑数会明显偏小。
  # 板子离得远、透视很强时可以降到 0.35；老是判 geometry 就先关掉（设 0）。
  min_gap_ratio: 0.45

  # 只有这些类别会上分类板（规则：玩偶/时钟/香蕉）。按名字写，改名不用改 ID。
  include_names: [bear, clock, banana]

  # 这些 ID 出现在分类板区域时忽略（场地标记/底板）
  ignore_ids: [10, 20, 30, 40, 50, 99]

  # 不上分类板、但区域固定的物品：蛋糕固定送 A 区（规则硬性要求）。
  # 这里注入后，runtask.py 用 self.mapping.get(item_type, ...) 就能直接查到 A 区。
  fixed_by_name:
    cake: Collection_A

  # 单帧最长等待时间（秒）；超时打印 warn 但不退出
  frame_timeout: 5.0

# 分类板识别失败/超时时的兜底放置区（只对 B/C/D 三类有意义，蛋糕永远走 A）
board_fallback_zone: Collection_B
